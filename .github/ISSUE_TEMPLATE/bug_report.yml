name: Bug report
description: Report a reproducible fault or unexpected behaviour
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a bug. Remove Discord tokens, private messages, and other sensitive data.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe what happened.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Describe what you expected.
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the target, filters, and exact action sequence.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Start ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Select the browser used for Discord.
      options:
        - Chrome
        - Edge
        - Brave
        - Opera
        - Vivaldi
        - Firefox
        - Other
    validations:
      required: true

  - type: dropdown
    id: userscript-manager
    attributes:
      label: Userscript manager
      description: Select the extension running Detcord.
      options:
        - Tampermonkey
        - Violentmonkey
        - Other
    validations:
      required: true

  - type: checkboxes
    id: chromium-settings
    attributes:
      label: Chromium setup
      description: Tick this only when using a Chromium browser.
      options:
        - label: I have enabled Developer mode and Allow user scripts (Chromium)

  - type: input
    id: version
    attributes:
      label: Detcord version
      description: Find the version in the userscript manager or Detcord window.
      placeholder: 1.1.0
    validations:
      required: true

  - type: input
    id: userscript-manager-version
    attributes:
      label: Userscript manager version
      placeholder: 5.x

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste relevant errors only. Remove tokens and private content.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots or details that do not expose private Discord data.
