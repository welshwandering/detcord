name: Feature request
description: Propose a user-facing improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and the feature roadmap before submitting a proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the problem without assuming a particular solution.
      placeholder: I need to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed behaviour
      description: Explain how the feature should work for a Discord user.
      placeholder: Detcord should ...
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy
      description: Explain any effect on tokens, stored progress, message content, confirmation, or rate limits.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds or other designs.

  - type: dropdown
    id: priority
    attributes:
      label: Importance
      options:
        - Useful but not urgent
        - Significant workflow improvement
        - Blocks my use case

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples or mock-ups without private Discord data.
