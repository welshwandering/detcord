name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build:userscript

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"

      - name: Install dependencies
        run: npm ci

      - name: Build userscript
        run: npm run build:userscript

      # This repository uses immutable releases, so action-gh-release v3 must
      # attach every asset while creating the release, before publication.
      - name: Create release and upload userscript
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/detcord.user.js
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            See [CHANGELOG.md](https://github.com/canaryframe/detcord/blob/${{ github.ref_name }}/CHANGELOG.md)
            for the full project changelog.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release asset and latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' |
            grep -Fxq 'detcord.user.js' || exit 1

          download_url='https://github.com/canaryframe/detcord/releases/latest/download/detcord.user.js'
          status=''
          for attempt in 1 2 3 4 5; do
            status="$(curl -sIL -o /dev/null -w '%{http_code}' "$download_url")"
            test "$status" = '200' && break
            sleep 2
          done
          test "$status" = '200' || exit 1
